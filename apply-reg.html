<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Training Registration | CDI Group</title>
    <!-- Premium Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Connected to assets/css/style.css -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            background: #0f1115;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent);
        }
        .form-container-premium {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header img {
            max-width: 70px;
            margin-bottom: 15px;
        }
        .form-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #d4af37;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .form-header p {
            font-size: 13px;
            color: #a0aec0;
            margin: 0;
        }
        .form-group-row {
            display: flex;
            gap: 20px;
        }
        .form-group {
            position: relative;
            margin-bottom: 25px;
            flex: 1;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 18px 15px 8px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #a0aec0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .form-group.textarea-group label {
            top: 25px;
            transform: none;
        }
        /* Premium Floating Label Animation Trigger */
        .form-group input:focus ~ label,
        .form-group input:not(:placeholder-shown) ~ label,
        .form-group select:focus ~ label,
        .form-group select:valid ~ label,
        .form-group textarea:focus ~ label,
        .form-group textarea:not(:placeholder-shown) ~ label {
            top: 6px;
            font-size: 10px;
            color: #d4af37;
            font-weight: 600;
            text-transform: uppercase;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }
        .form-group select option {
            background: #1a1d24;
            color: #fff;
        }
        .submit-btn-premium {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8416 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }
        .back-home {
            text-align: center;
            margin-top: 25px;
        }
        .back-home a {
            color: #a0aec0;
            text-decoration: none;
            font-size: 13px;
        }
        .back-home a:hover { color: #d4af37; }

        @media (max-width: 600px) {
            .form-group-row { flex-direction: column; gap: 0; }
            .form-container-premium { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="form-page-wrapper">
        <div class="form-container-premium">
            
            <div class="form-header">
                <img src="logo.png" alt="CDI Logo" onerror="this.src='https://via.placeholder.com/70?text=CDI';">
                <h2 data-key="form-title">MANAGEMENT TRAINING REGISTRATION</h2>
                <p data-key="form-subtitle">Ceylon Direxa International | CDI Group Careers</p>
            </div>

            <!-- 100% Working Redirect Form Method -->
            <form action="https://docs.google.com/forms/d/e/1FAIpQLSdDE1NfaN4uiJVFhFAQ6WByc4K2dQrm2-PPzBhaTD6CxNf46Q/viewform" method="GET" target="_blank">
                
                <!-- Hidden inputs to trigger auto-fill on Google Form -->
                <input type="hidden" name="usp" value="pp_url">

                <!-- Full Name -->
                <div class="form-group">
                    <input type="text" name="entry.2105528632" placeholder=" " required>
                    <label data-key="lbl-form-name">Full Name (සම්පූර්ණ නම)</label>
                </div>

                <div class="form-group-row">
                    <!-- Contact Number -->
                    <div class="form-group">
                        <input type="tel" name="entry.899543731" placeholder=" " pattern="[0-9]{10}" required>
                        <label data-key="lbl-form-phone">Contact Number (දුරකථන අංකය)</label>
                    </div>
                    <!-- Whatsapp Number -->
                    <div class="form-group">
                        <input type="tel" name="entry.989116378" placeholder=" " pattern="[0-9]{10}" required>
                        <label>Whatsapp Number (වට්ස්ඇප් අංකය)</label>
                    </div>
                </div>

                <div class="form-group-row">
                    <!-- Age -->
                    <div class="form-group">
                        <input type="number" name="entry.1589322204" min="18" max="35" placeholder=" " required>
                        <label data-key="lbl-form-age">Age (වයස)</label>
                    </div>
                    <!-- District -->
                    <div class="form-group">
                        <input type="text" name="entry.188270919" placeholder=" " required>
                        <label data-key="lbl-form-district">District (දිස්ත්‍රික්කය)</label>
                    </div>
                </div>

                <!-- Education Qualification Dropdown (Direct Link) -->
                <div class="form-group">
                    <select required onchange="this.setAttribute('value', this.value);">
                        <option value="" disabled selected hidden></option>
                        <option value="GCE O/L">GCE O/L</option>
                        <option value="GCE A/L">GCE A/L</option>
                        <option value="Diploma / Higher Diploma">Diploma / Higher Diploma</option>
                        <option value="Bachelor's Degree or Above">Bachelor's Degree or Above</option>
                    </select>
                    <label data-key="lbl-form-edu">Highest Education Qualification (අධ්‍යාපන සුදුසුකම්)</label>
                </div>

                <!-- Preferred Division Dropdown (Direct Link) -->
                <div class="form-group">
                    <select required onchange="this.setAttribute('value', this.value);">
                        <option value="" disabled selected hidden></option>
                        <option value="Ceylon Education">Ceylon Education</option>
                        <option value="Ceylon Smart home">Ceylon Smart home</option>
                        <option value="Ceylon Investment & Micro Credit">Ceylon Investment & Micro Credit</option>
                        <option value="Ceylon Automotive">Ceylon Automotive</option>
                        <option value="Coporate Management & Consultancy">Corporate Management & Consultancy</option>
                    </select>
                    <label data-key="lbl-form-div">Preferred Business Division (කැමති අංශය)</label>
                </div>

                <!-- Short Message Textarea -->
                <div class="form-group textarea-group">
                    <textarea rows="3" placeholder=" "></textarea>
                    <label data-key="lbl-form-msg">Why do you want to join us? (සම්බන්ධ වීමට අදහස් කළේ ඇයි?)</label>
                </div>

                <!-- Premium Submit Button -->
                <button type="submit" class="submit-btn-premium">
                    PROCEED TO SUBMIT <i class="fas fa-arrow-right"></i>
                </button>

            </form>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Website</a>
            </div>

        </div>
    </div>

    <!-- Connected to assets/js/language.js for bilingual translation -->
    <script src="assets/js/language.js"></script>
</body>
</html>
