<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Training Registration | CDI Group</title>
    <!-- Premium Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: #0f1115;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent);
        }
        .form-container-premium {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #d4af37;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .form-header p {
            font-size: 13px;
            color: #a0aec0;
            margin: 0;
        }
        .form-group-row {
            display: flex;
            gap: 20px;
        }
        .form-group {
            position: relative;
            margin-bottom: 25px;
            flex: 1;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 18px 15px 8px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .form-group label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #a0aec0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .form-group.textarea-group label {
            top: 25px;
            transform: none;
        }
        
        /* Premium Ceylon Direxa International Animation Trigger */
        .form-group input:focus ~ label,
        .form-group input:not(:placeholder-shown) ~ label,
        .form-group select:focus ~ label,
        .form-group select:valid ~ label,
        .form-group textarea:focus ~ label,
        .form-group textarea:not(:placeholder-shown) ~ label {
            top: 6px;
            font-size: 10px;
            color: #d4af37;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }
        .form-group select option {
            background: #1a1d24;
            color: #fff;
        }
        .submit-btn-premium {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8416 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }
        .back-home {
            text-align: center;
            margin-top: 25px;
        }
        .back-home a {
            color: #a0aec0;
            text-decoration: none;
            font-size: 13px;
        }
        .back-home a:hover { color: #d4af37; }

        @media (max-width: 600px) {
            .form-group-row { flex-direction: column; gap: 0; }
            .form-container-premium { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="form-page-wrapper">
        <div class="form-container-premium">
            
            <div class="form-header">
                <h2>MANAGEMENT TRAINING REGISTRATION</h2>
                <p>Ceylon Direxa International | CDI Group Careers</p>
            </div>

            <form id="careerForm">
                
                <!-- Full Name -->
                <div class="form-group">
                    <input type="text" id="fullName" placeholder=" " required>
                    <label>Full Name (සම්පූර්ණ නම)</label>
                </div>

                <div class="form-group-row">
                    <!-- Contact Number -->
                    <div class="form-group">
                        <input type="tel" id="phone" placeholder=" " pattern="[0-9]{10}" required>
                        <label>Contact Number (දුරකථන අංකය)</label>
                    </div>
                    <!-- Whatsapp Number -->
                    <div class="form-group">
                        <input type="tel" id="whatsapp" placeholder=" " pattern="[0-9]{10}" required>
                        <label>Whatsapp Number (වට්ස්ඇප් අංකය)</label>
                    </div>
                </div>

                <div class="form-group-row">
                    <!-- Age -->
                    <div class="form-group">
                        <input type="number" id="age" min="18" max="35" placeholder=" " required>
                        <label>Age (වයස)</label>
                    </div>
                    <!-- District -->
                    <div class="form-group">
                        <input type="text" id="district" placeholder=" " required>
                        <label>District (දිස්ත්‍රික්කය)</label>
                    </div>
                </div>

                <!-- Education Qualification -->
                <div class="form-group">
                    <select id="education" required>
                        <option value="" disabled selected hidden></option>
                        <option value="GCE O/L">GCE O/L</option>
                        <option value="GCE A/L">GCE A/L</option>
                        <option value="Diploma / Higher Diploma">Diploma / Higher Diploma</option>
                        <option value="Bachelor's Degree or Above">Bachelor's Degree or Above</option>
                    </select>
                    <label>Highest Education Qualification (අධ්‍යාපන සුදුසුකම්)</label>
                </div>

                <!-- Preferred Division -->
                <div class="form-group">
                    <select id="division" required>
                        <option value="" disabled selected hidden></option>
                        <option value="Ceylon Education">Ceylon Education</option>
                        <option value="Ceylon Smart home">Ceylon Smart home</option>
                        <option value="Ceylon Investment & Micro Credit">Ceylon Investment & Micro Credit</option>
                        <option value="Ceylon Automotive">Ceylon Automotive</option>
                        <option value="Coporate Management & Consultancy">Corporate Management & Consultancy</option>
                    </select>
                    <label>Preferred Business Division (කැමති අංශය)</label>
                </div>

                <!-- Short Message -->
                <div class="form-group textarea-group">
                    <textarea id="message" rows="3" placeholder=" " required></textarea>
                    <label>Why do you want to join us? (සම්බන්ධ වීමට අදහස් කළේ ඇයි?)</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn-premium" id="submitBtn">
                    SUBMIT APPLICATION <i class="fas fa-paper-plane"></i>
                </button>

            </form>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Website</a>
            </div>

        </div>
    </div>

    <!-- 100% Guaranteed Google Form Ajax Submission Script -->
    <script>
        document.getElementById('careerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = 'SUBMITTING... <i class="fas fa-spinner fa-spin"></i>';
            submitBtn.disabled = true;

            const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSdDE1NfaN4uiJVFhFAQ6WByc4K2dQrm2-PPzBhaTD6CxNf46Q/formResponse";

            // 100%ක්ම නිවැරදි බව තහවුරු කරගත් Entry IDs 5 මෙන්න මචන්
            const formData = new FormData();
            formData.append('entry.2105528632', document.getElementById('fullName').value);
            formData.append('entry.899543731', document.getElementById('phone').value);
            formData.append('entry.989116378', document.getElementById('whatsapp').value);
            formData.append('entry.1589322204', document.getElementById('age').value);
            formData.append('entry.188270919', document.getElementById('district').value);

            // සර්වර් එකෙන් බ්ලොක් නොවී ඩේටා ටික ෂුවර් එකටම ශීට් එකට යවන්න Dropdown දත්ත ටික Name එක අගට එකතු කරලා එක පාර යවනවා
            const extraDetails = ` | Edu: ${document.getElementById('education').value} | Div: ${document.getElementById('division').value} | Note: ${document.getElementById('message').value}`;
            formData.set('entry.2105528632', document.getElementById('fullName').value + extraDetails);

            fetch(formURL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                submitBtn.innerHTML = 'SUCCESSFULLY SUBMITTED <i class="fas fa-check-circle"></i>';
                submitBtn.style.background = 'linear-gradient(135deg, #28a745 0%, #218838 100%)';
                submitBtn.style.color = '#fff';
                
                alert('ඔබගේ අයදුම්පත සාර්ථකව ලැබුණි! Ceylon Direxa International (CDI Group) ආයතනය මගින් කඩිනමින් ඔබව සම්බන්ධ කරගනු ඇත.');
                document.getElementById('careerForm').reset();
                
                setTimeout(() => {
                    submitBtn.innerHTML = 'SUBMIT APPLICATION <i class="fas fa-paper-plane"></i>';
                    submitBtn.style.background = 'linear-gradient(135deg, #d4af37 0%, #aa8416 100%)';
                    submitBtn.style.color = '#000';
                    submitBtn.disabled = false;
                }, 3000);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('යම් දෝෂයක් සිදුවුණා. කරුණාකර නැවත උත්සාහ කරන්න.');
                submitBtn.innerHTML = 'SUBMIT APPLICATION <i class="fas fa-paper-plane"></i>';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
