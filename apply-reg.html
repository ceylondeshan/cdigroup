<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Application | CDI Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        /* Career Form Premium Custom Styles */
        body {
            background: #0f1115;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.1), transparent);
        }
        .form-container-premium {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header img {
            max-width: 70px;
            margin-bottom: 15px;
        }
        .form-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #d4af37; /* Premium Gold */
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }
        .form-header p {
            font-size: 13px;
            color: #a0aec0;
            margin: 0;
        }
        .form-group-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #cbd5e0;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 15px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .form-group select option {
            background: #1a1d24;
            color: #fff;
        }
        .submit-btn-premium {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8416 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
            opacity: 0.95;
        }
        .back-home {
            text-align: center;
            margin-top: 25px;
        }
        .back-home a {
            color: #a0aec0;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }
        .back-home a:hover {
            color: #d4af37;
        }
        /* Mobile Responsive Step */
        @media (max-width: 600px) {
            .form-group-row {
                flex-direction: column;
                gap: 0;
            }
            .form-container-premium {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="form-page-wrapper">
        <div class="form-container-premium">
            
            <div class="form-header">
                <img src="logo.png" alt="CDI Logo" onerror="this.src='https://via.placeholder.com/70?text=CDI';">
                <h2 data-key="form-title">MANAGEMENT TRAINING REGISTRATION</h2>
                <p data-key="form-subtitle">Ceylon Direxa International | CDI Group Careers</p>
            </div>

            <form id="careerForm">
                
                <div class="form-group">
                    <label data-key="lbl-form-name">Full Name (සම්පූර්ණ නම)</label>
                    <input type="text" id="fullName" name="fullName" placeholder="E.g., Deshan Wijerathne" required>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label data-key="lbl-form-phone">Contact Number (දුරකථන අංකය)</label>
                        <input type="tel" id="phone" name="phone" placeholder="E.g., 0775009504" pattern="[0-9]{10}" title="කරුණාකර නිවැරදි දුරකථන අංකය ඇතුළත් කරන්න (ඉලක්කම් 10)" required>
                    </div>
                    <div class="form-group">
                        <label data-key="lbl-form-age">Age (වයස)</label>
                        <input type="number" id="age" name="age" min="18" max="35" placeholder="18 - 30 Preferred" required>
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label data-key="lbl-form-district">District (දිස්ත්‍රික්කය)</label>
                        <select id="district" name="district" required>
                            <option value="" disabled selected>Select District</option>
                            <option value="Anuradhapura">Anuradhapura</option>
                            <option value="Polonnaruwa">Polonnaruwa</option>
                            <option value="Kurunegala">Kurunegala</option>
                            <option value="Kandy">Kandy</option>
                            <option value="Colombo">Colombo</option>
                            <option value="Gampaha">Gampaha</option>
                            <option value="Other">Other (වෙනත්)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-key="lbl-form-edu">Highest Education Qualification</label>
                        <select id="education" name="education" required>
                            <option value="" disabled selected>Select Qualification</option>
                            <option value="O/L">G.C.E. O/L</option>
                            <option value="A/L">G.C.E. A/L</option>
                            <option value="Diploma">Diploma / Higher Diploma</option>
                            <option value="Degree">Bachelor's Degree or Above</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label data-key="lbl-form-div">Preferred Business Division (කැමති අංශය)</label>
                    <select id="division" name="division" required>
                        <option value="" disabled selected>Select Division</option>
                        <option value="Education">Ceylon Education</option>
                        <option value="Smart Home">Ceylon Smart Home</option>
                        <option value="Investment & Credit">Ceylon Investment & Micro Credit</option>
                        <option value="Auto Care">Ceylon Auto Care</option>
                        <option value="Management & Consultancy">Corporate Management & Consultancy</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-key="lbl-form-msg">Briefly describe why you want to join us (ඔබ අප හා සම්බන්ධ වීමට හේතුව)</label>
                    <textarea id="message" name="message" rows="3" placeholder="Tell us about your career goals..."></textarea>
                </div>

                <button type="submit" class="submit-btn-premium" id="submitBtn">
                    SUBMIT APPLICATION <i class="fas fa-paper-plane"></i>
                </button>

            </form>

            <div class="back-home">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Main Website</a>
            </div>

        </div>
    </div>

    <script src="assets/js/language.js"></script>
</body>
</html>
