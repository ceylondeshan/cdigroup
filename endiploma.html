<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Diploma Registration | CDI Group</title>
    <!-- Premium Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d0f12;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }
        .reg-card {
            background: rgba(22, 27, 34, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 30px 22px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.08);
        }
        .reg-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .reg-header .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 50%;
            margin-bottom: 12px;
            color: #d4af37;
            font-size: 22px;
        }
        .reg-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .reg-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 3px;
        }
        
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        select.form-control option {
            background: #161b22;
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa8416 100%);
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .info-note {
            background: rgba(212, 175, 55, 0.08);
            border-left: 3px solid #d4af37;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="reg-card">
        
        <div class="reg-header">
            <div class="logo-badge">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h2>Diploma in English</h2>
            <p>Ceylon Direxa International | Education Hub</p>
        </div>

        <form id="diplomaForm">
            <!-- Full Name -->
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name (සම්පූර්ණ නම)</label>
                <input type="text" id="fullName" class="form-control" placeholder="Ex: Nimal Perera" required>
            </div>

            <!-- Phone / WhatsApp -->
            <div class="form-group">
                <label><i class="fas fa-phone"></i> WhatsApp / Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="Ex: 0771234567" required>
            </div>

            <!-- NIC Number -->
            <div class="form-group">
                <label><i class="fas fa-id-card"></i> NIC Number (ජාතික හැඳුනුම්පත් අංකය)</label>
                <input type="text" id="nic" class="form-control" placeholder="Ex: 200012345678 / 951234567V" required>
            </div>

            <!-- Town / City -->
            <div class="form-group">
                <label><i class="fas fa-location-dot"></i> City / Town (නගරය)</label>
                <input type="text" id="city" class="form-control" placeholder="Ex: Anuradhapura / Dambulla" required>
            </div>

            <!-- Batch Selection -->
            <div class="form-group">
                <label><i class="fas fa-clock"></i> Preferred Batch (කැමති වේලාව)</label>
                <select id="batch" class="form-control" required>
                    <option value="">Select Option</option>
                    <option value="Physical - Weekday">Physical Classes (සති දින)</option>
                    <option value="Physical - Weekend">Physical Classes (සති අන්ත)</option>
                    <option value="Online - Night">Online Batch (රාත්‍රී කාලය)</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="subBtn">
                <i class="fas fa-paper-plane"></i> REGISTER NOW
            </button>
        </form>

        <div class="info-note">
            <i class="fas fa-info-circle"></i> 
            Submit කළ පසු කරුණාකර WhatsApp වෙත යොමු වන Message එක යොමු කර ඔබේ ලියාපදිංචිය තහවුරු කරගන්න.
        </div>

    </div>

    <script>
        document.getElementById('diplomaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var btn = document.getElementById('subBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> REGISTERING...';
            btn.disabled = true;

            var name = document.getElementById('fullName').value;
            var phone = document.getElementById('phone').value;
            var nic = document.getElementById('nic').value;
            var city = document.getElementById('city').value;
            var batch = document.getElementById('batch').value;

            // Direct WhatsApp Redirect Text
            var waMessage = `Hi CDI Education Hub,%0A%0A*New English Diploma Registration*%0A*Name:* ${encodeURIComponent(name)}%0A*Phone:* ${encodeURIComponent(phone)}%0A*NIC:* ${encodeURIComponent(nic)}%0A*City:* ${encodeURIComponent(city)}%0A*Batch:* ${encodeURIComponent(batch)}`;

            // Redirect to Company WhatsApp (077 500 9504)
            setTimeout(function() {
                window.location.href = `https://wa.me/94775009504?text=${waMessage}`;
            }, 1000);
        });
    </script>
</body>
</html>
